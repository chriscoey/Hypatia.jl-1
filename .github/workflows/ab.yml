name: AB examples
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arm: [base, head]
        shard: [3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: drv
      - id: cfg
        run: cat drv/ab/config >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.arm == 'base' && steps.cfg.outputs.base || github.event.pull_request.head.sha }}
          path: hyp
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=hyp/examples -e 'using Pkg; Pkg.instantiate(); Pkg.develop(PackageSpec(path="hyp"))'
      # restart after a crash; the driver resumes and records the killed instance.
      # an instance past 10 GB resident is killed before it takes the runner down
      - run: |
          OUT=ab-${{ matrix.arm }}-${{ matrix.shard }}.csv
          for attempt in 1 2 3 4 5 6; do
            julia --project=hyp/examples drv/ab/ab_examples.jl hyp $OUT ${{ steps.cfg.outputs.filter }} &
            jp=$!
            while kill -0 $jp 2>/dev/null; do
              sleep 5
              rss=$(ps -o rss= -p $jp | tr -d ' ')
              if [ "${rss:-0}" -gt 10000000 ]; then
                echo "watchdog: killing $(cat $OUT.inprogress 2>/dev/null) at rss ${rss} KB"
                kill -9 $jp
              fi
            done
            wait $jp && break
            echo "attempt $attempt exited"
          done
          true
        env:
          AB_SHARD: ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.arm }}-${{ matrix.shard }}
          path: ab-${{ matrix.arm }}-${{ matrix.shard }}.csv
